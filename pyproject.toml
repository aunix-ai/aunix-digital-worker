[project]
name = "aunix-digital-worker"
version = "0.1.0"
description = "Aunix Digital Worker - agentic monitoring and analysis platform (core engine)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "anthropic>=0.92",
    "pydantic-settings>=2.6",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "apscheduler>=3.11",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
    "openai>=2.41.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aunix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
