[project]
name = "aunix-digital-worker"
version = "0.1.0"
description = "Aunix Digital Worker - agentic monitoring and analysis platform (core engine)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aunix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
